# Dataset source for FedX-Palm v2.
#
# Confirmed directly against the real downloaded data.yaml (2026-07-03):
# 9982 train + 416 valid + 416 test = 10814 images total. Class instance
# counts are imbalanced -- "Empty Bunch" is the minority class everywhere
# (~2033/9982 in train, ~20% of the largest class) -- see
# src/fedxpalm/data/split.py's post-split class audit, which specifically
# warns if any class ends up with zero instances in a split (this bit a
# prior rebuild attempt of this exact dataset).

roboflow:
  api_key: "Ej0bSMpeSri3ky0IYkOU"   # move to $ROBOFLOW_API_KEY before committing/sharing this repo further
  workspace: "dydy-worker"
  project: "palm-fruit-ripeness-detection-f6sac-ccb2z"
  version: 2
  format: "yolov11"

download_dir: "data/raw"

# 6 ripeness classes, alphabetical order (confirmed against real data.yaml):
names:
  - Abnormal
  - Empty Bunch
  - Overripe
  - Ripe
  - Underripe
  - Unripe
nc: 6

# Leakage-free split: group images by bunch identity before splitting, so
# frames of the same physical FFB never straddle train/val/test, then
# stratify by each bunch's dominant class. Bunch-id extraction logic lives
# in src/fedxpalm/data/split.py (not configurable here) -- it strips
# Roboflow's `.rf.<hash>` suffix first, then matches the leading
# `frame[a-z]*\d+` token, e.g. "frame1-10-_png_jpg.rf.<hash>.jpg" ->
# "frame1". Confirmed against this dataset's real filenames (2026-07-03);
# if a future dataset version changes naming, update _parse_bunch_id there.
split_ratios:
  train: 0.80
  val: 0.10
  test: 0.10
split_seed: 42

output_dir: "data/splits"
