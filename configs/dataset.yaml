# Dataset source for FedX-Palm v2.
#
# Confirmed directly against the real downloaded data.yaml (2026-07-03):
# 9982 train + 416 valid + 416 test = 10814 images total. Class instance
# counts are imbalanced -- "Empty Bunch" is the minority class everywhere
# (~2033/9982 in train, ~20% of the largest class) -- see
# src/fedxpalm/data/split.py's post-split class audit, which specifically
# warns if any class ends up with zero instances in a split (this bit a
# prior rebuild attempt of this exact dataset).
#
# Split: Roboflow's own train/valid/test split is used as-is (copied
# verbatim by scripts/02_prepare_splits.py, "valid" renamed to "val" for
# this repo's naming convention) -- no bunch-identity re-split.

roboflow:
  api_key: "Ej0bSMpeSri3ky0IYkOU"   # move to $ROBOFLOW_API_KEY before committing/sharing this repo further
  workspace: "dydy-worker"
  project: "palm-fruit-ripeness-detection-f6sac-ccb2z"
  version: 2
  format: "yolov11"

download_dir: "data/raw_v2"   # separate from the old bunch-split era's data/raw, so a stale
                                # leftover checkout of that folder can't silently contaminate this run

# 6 ripeness classes, alphabetical order (confirmed against real data.yaml):
names:
  - Abnormal
  - Empty Bunch
  - Overripe
  - Ripe
  - Underripe
  - Unripe
nc: 6

output_dir: "data/splits_v2"
