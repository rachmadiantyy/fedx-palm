# Dataset source for FedX-Palm v2.
#
# NOTE: the Claude Code sandbox that generated this scaffold could not reach
# api.roboflow.com (blocked by the environment's egress policy). The class
# list below was cross-checked against a separate, independent rebuild of
# this exact same Roboflow project (branch claude/thesis-rebuild-dp-sgd,
# thesis_rebuild/scripts/00_download_dataset.py) rather than guessed --
# still confirm it against your own downloaded <download_dir>/data.yaml
# after running scripts/01_download_dataset.py, in case that branch applied
# its own renaming on top of Roboflow's raw class list.

roboflow:
  api_key: "Ej0bSMpeSri3ky0IYkOU"   # move to $ROBOFLOW_API_KEY before committing/sharing this repo further
  workspace: "dydy-worker"
  project: "palm-fruit-ripeness-detection-f6sac-ccb2z"
  version: 2
  format: "yolov11"

download_dir: "data/raw"

# 6 ripeness classes, alphabetical order (cross-checked, see note above --
# still verify against your own downloaded data.yaml):
names:
  - Abnormal
  - Empty Bunch
  - Overripe
  - Ripe
  - Underripe
  - Unripe
nc: 6

# Leakage-free split: group images by bunch identity (parsed from filename)
# before splitting, so frames of the same physical FFB never straddle
# train/val/test.
bunch_id_regex: '^(?P<bunch_id>.+?)(?:_\d+)?\.(jpg|jpeg|png)$'
split_ratios:
  train: 0.70
  val: 0.15
  test: 0.15
split_seed: 42

output_dir: "data/splits"
