# Palm Fruit Ripeness Detection - Data Configuration
# ===================================================
# Dataset: Roboflow "palm-fruit-ripeness-detection-f6sac-ccb2z" (version 2)
# Format: YOLOv11
#
# To download the dataset, run:
#   python scripts/download_dataset.py --api-key YOUR_ROBOFLOW_API_KEY --split-clients 4

# Dataset root directory
path: /app/data

# Train/Val splits (relative to path)
train: images/train
val: images/val

# Number of classes
nc: 6

# Class names for Palm Fruit Ripeness levels (6 classes)
# Order follows Roboflow source dataset (alphabetical)
names:
  0: Abnormal
  1: Empty Bunch
  2: Overripe
  3: Ripe
  4: Underripe
  5: Unripe
