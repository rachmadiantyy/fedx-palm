# Palm Fruit Ripeness Detection - Data Configuration
# ===================================================
# Dataset: Roboflow "palm-fruit-ripeness-detection-f6sac-ccb2z" (version 2)
# Format: YOLOv11
#
# To download the dataset, run:
#   python scripts/download_dataset.py --api-key YOUR_ROBOFLOW_API_KEY --split-clients 3

# Dataset root directory
path: /app/data

# Train/Val splits (relative to path)
train: images/train
val: images/val

# Number of classes
nc: 4

# Class names for Palm Fruit Ripeness levels
names:
  0: unripe
  1: underripe
  2: ripe
  3: overripe
