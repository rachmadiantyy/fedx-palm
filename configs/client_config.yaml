# FedX-PALM Client Configuration
# ================================
# Palm Fruit Ripeness Detection - Federated Learning Client

client:
  id: "client_1"  # Override with --client-id or CLIENT_ID env var
  server_url: "http://localhost:5000"  # Flower gRPC (thesis Section 3.2.3.1)

# Local Training Settings (thesis Table 3.5)
training:
  local_epochs: 5
  batch_size: 16
  learning_rate: 0.01
  imgsz: 640
  optimizer: "AdamW"  # thesis Table 3.5
  momentum: 0.937
  weight_decay: 0.0005
  patience: 10

# Data Configuration & Augmentation (thesis Section 3.3.2)
data:
  config_path: "./data/data.yaml"
  augmentation: true
  # Geometric augmentation
  degrees: 15.0      # Rotation ±15° (thesis Section 3.3.2 item 3)
  fliplr: 0.5        # Horizontal flip probability
  scale: 0.2         # Random scaling 0.8–1.2 (1.0 ± scale)
  translate: 0.1     # Translation fraction
  # Photometric augmentation (HSV jitter)
  hsv_h: 0.015       # Hue jitter
  hsv_s: 0.7         # Saturation jitter
  hsv_v: 0.4         # Value jitter
  # Mosaic augmentation (YOLO-specific)
  mosaic: 1.0
  mixup: 0.0
  copy_paste: 0.0

# Model Settings
model:
  variant: "yolo11n.pt"
  num_classes: 6  # Palm ripeness (Roboflow order): Abnormal, Empty Bunch, Overripe, Ripe, Underripe, Unripe
  freeze_backbone: false

# Local Differential Privacy
differential_privacy:
  enabled: true
  epsilon: 1.0
  delta: 1.0e-5
  max_grad_norm: 1.0
  noise_multiplier: 1.0

# FedProx Settings
fedprox:
  enabled: false
  mu: 0.01  # Proximal term coefficient

# XAI Settings
explainability:
  enabled: true
  method: "grad-cam"  # Options: grad-cam, shap, both
  generate_every_n_rounds: 5
  privacy_epsilon: 1.0  # Privacy budget for explanations
  output_dir: "./xai_reports"

# Communication
communication:
  max_retries: 3
  retry_delay: 5.0
  timeout: 120

# Logging
logging:
  level: "INFO"
  file: "./logs/client.log"
