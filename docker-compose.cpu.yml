# FedX-PALM: CPU-only Docker Compose
# Use this for development/testing without GPU

version: "3.8"

services:
  fl-server:
    build:
      context: .
      dockerfile: docker/Dockerfile.server
    container_name: fedx-palm-server
    ports:
      - "8080:8080"
    environment:
      - FL_NUM_ROUNDS=10
      - FL_MIN_CLIENTS=2
      - FL_AGGREGATION=fedavg
      - FL_MODEL_VARIANT=yolo11n.pt
      - FL_NUM_CLASSES=4
      - DP_ENABLED=true
      - DP_EPSILON=1.0
      - DP_DELTA=1e-5
      - CUDA_VISIBLE_DEVICES=""
    volumes:
      - server_checkpoints:/app/checkpoints
      - ./configs:/app/configs:ro
    networks:
      - fl-network
    restart: unless-stopped

  fl-client-1:
    build:
      context: .
      dockerfile: docker/Dockerfile.client
    container_name: fedx-palm-client-1
    environment:
      - CUDA_VISIBLE_DEVICES=""
    volumes:
      - ./data/client_1:/app/data
    networks:
      - fl-network
    depends_on:
      - fl-server
    restart: unless-stopped
    command: >
      --client-id client_1
      --server-url http://fl-server:8080
      --data-config /app/data/data.yaml
      --num-classes 4
      --local-epochs 2
      --batch-size 8
      --dp-enabled

  fl-client-2:
    build:
      context: .
      dockerfile: docker/Dockerfile.client
    container_name: fedx-palm-client-2
    environment:
      - CUDA_VISIBLE_DEVICES=""
    volumes:
      - ./data/client_2:/app/data
    networks:
      - fl-network
    depends_on:
      - fl-server
    restart: unless-stopped
    command: >
      --client-id client_2
      --server-url http://fl-server:8080
      --data-config /app/data/data.yaml
      --num-classes 4
      --local-epochs 2
      --batch-size 8
      --dp-enabled

networks:
  fl-network:
    driver: bridge

volumes:
  server_checkpoints:
    driver: local
